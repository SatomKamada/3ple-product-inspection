<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品横断検索 | 管理画面モック</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
:root {
  --bg: #f3f6fa;
  --line: #dfe3e8;
  --text: #222;
  --muted: #6b7280;
  --link: #3a7bd5;
  --primary: #3a7bd5;
  --hdr-products: #b3cbe9;
  --hdr-attributes: #f3ddbb;
  --hdr-variants: #c4e8d7;
  --ace-orange: #fd7220;
  --ace-sidebar: #fbe0d6;
  --ace-sidebar-line: #f0c9ba;
  --ace-sidebar-active: #f6c8b5;
}
body { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; font-size: 14px; background: var(--bg); color: var(--text); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.app-header { height: 64px; background: var(--ace-orange); color: #fff; display: flex; align-items: center; padding: 0 20px 0 12px; position: sticky; top: 0; z-index: 1030; }
.app-logo { color: #fff; font-weight: 700; font-size: 30px; letter-spacing: .02em; width: 188px; }
.app-shop { color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 14px; }
.app-shop .bi { font-size: 22px; -webkit-text-stroke: 1px; }
.app-logo:hover, .app-shop:hover { color: #fff; text-decoration: none; }
.mock-pill { background: #fff; color: var(--ace-orange); font-weight: 700; font-size: 14px; border-radius: 20px; padding: 6px 14px; letter-spacing: .04em; }
.app-user { background: none; border: none; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; padding: 0; }
.app-user .bi-person-circle { font-size: 30px; }
.app-user .bi-chevron-down { font-size: 18px; -webkit-text-stroke: 1px; }
.app-body { display: flex; min-height: calc(100vh - 64px); }
.app-sidebar { width: 200px; flex-shrink: 0; background: var(--ace-sidebar); border-right: 1px solid var(--ace-sidebar-line); }
.side-menu, .side-sub { list-style: none; padding: 0; margin: 0; }
.side-menu > li { border-bottom: 1px solid var(--ace-sidebar-line); }
.side-menu a { display: flex; align-items: center; gap: 10px; color: #333; padding: 12px 14px; font-size: 14px; }
.side-menu a:hover { text-decoration: none; background: rgba(255,255,255,.35); }
.side-menu a > .bi:first-child { font-size: 17px; color: #444; width: 20px; text-align: center; }
.side-menu .caret { margin-left: auto; font-size: 15px; -webkit-text-stroke: .6px; transition: transform .15s; }
.side-menu a[aria-expanded="true"] .caret { transform: rotate(180deg); }
.side-sub a { padding: 9px 14px 9px 44px; font-size: 13px; }
.side-sub a.current { background: var(--ace-sidebar-active); font-weight: 700; }
.app-main { flex: 1; min-width: 0; background: var(--bg); }
.page-title { display: flex; align-items: baseline; gap: 10px; background: #fff; padding: 18px 16px 16px; }
.page-title h1 { font-size: 20px; font-weight: 700; margin: 0; }
.page-title .sub { font-size: 13px; }
.page-content { padding: 20px 16px 48px; }
.search-card { border: none; border-radius: 4px; }
.search-card .card-header { background: #fff; display: flex; align-items: center; cursor: pointer; font-size: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.search-card .toggle-ico { font-size: 18px; -webkit-text-stroke: 1px; }
.search-card .card-header .bi-search { font-size: 18px; }
.search-card .card-header[aria-expanded="false"] .toggle-ico { transform: rotate(180deg); }
.toggle-ico { transition: transform .15s; }
.search-card .card-body { padding: 24px 24px 28px; }
.search-card .row { --bs-gutter-x: 3rem; }
.form-label { font-size: 13px; margin-bottom: 6px; display: inline-flex; align-items: center; }
.form-control, .form-select { font-size: 14px; border-color: #d5dae0; padding-top: .5rem; padding-bottom: .5rem; }
.form-control::placeholder { color: #8a8f96; }
.help { display: inline-flex; width: 18px; height: 18px; border-radius: 50%; background: #222; color: #fff; font-size: 11px; font-weight: 700; align-items: center; justify-content: center; margin-left: 4px; cursor: help; }
.range { display: flex; align-items: center; gap: 16px; }
.range .form-control { flex: 1; min-width: 0; }
.search-actions { display: flex; justify-content: center; gap: 12px; margin: 20px 0 24px; }
.btn-search { min-width: 200px; }
.result-card { border: none; border-radius: 4px; }
.result-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.result-summary { font-size: 15px; font-weight: 700; }
.result-summary .num { font-size: 18px; margin: 0 2px; }
.result-tools { display: flex; align-items: center; gap: 20px; font-size: 13px; }
.cond-list { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.cond-chip { font-size: 12px; background: #f1f3f6; border: 1px solid var(--line); border-radius: 3px; padding: 1px 8px; }
.cond-chip .scope { color: var(--muted); margin-right: 4px; }
.focus-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #eaf2fc; border: 1px solid #c8daf2; border-radius: 4px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
.result-tabs { border-bottom: 2px solid var(--line); }
.result-tabs .nav-link { color: var(--muted); border: none; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 10px 18px; display: flex; align-items: center; gap: 6px; }
.result-tabs .nav-link:hover { color: var(--text); }
.result-tabs .nav-link.active { color: var(--text); font-weight: 700; background: none; }
.result-tabs .tab-btn-products.active   { border-bottom-color: #6f9bd6; }
.result-tabs .tab-btn-attributes.active { border-bottom-color: #d9a85a; }
.result-tabs .tab-btn-variants.active   { border-bottom-color: #5fb88f; }
.tab-count { background: #e7ebf0; color: #333; border-radius: 10px; font-size: 12px; padding: 0 8px; font-weight: 500; }
.pane-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 0 10px; }
.pane-info { font-size: 13px; color: var(--muted); }
.pager { display: flex; justify-content: center; flex: 1; }
.pager .pagination { margin: 0; }
.pager .page-link { color: var(--link); font-size: 13px; padding: 5px 11px; }
.pager .page-item.active .page-link { background: var(--primary); border-color: var(--primary); color: #fff; }
.pager .ellipsis { padding: 5px 6px; color: var(--muted); }
.table-wrap { overflow-x: auto; }
.table-x { width: 100%; margin: 0; font-size: 13px; border-collapse: collapse; }
.table-x th, .table-x td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table-x thead th { font-weight: 700; vertical-align: bottom; line-height: 1.35; }
.table-x tbody tr:hover { background: #fafbfc; }
.tab-products   thead th { background: var(--hdr-products); }
.tab-attributes thead th { background: var(--hdr-attributes); }
.tab-variants   thead th { background: var(--hdr-variants); }
.table-x th.sortable { cursor: pointer; user-select: none; }
.table-x th .sort-ico { color: #7a8594; font-size: 12px; }
.table-x th .sort-ico.active { color: #111; }
.table-x .nowrap { white-space: nowrap; }
.table-x .num { text-align: left; }
.col-name { min-width: 180px; }
.col-narrow { max-width: 90px; }
.thumb { width: 44px; height: 44px; background: #f4f5f7; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #cfd4db; font-size: 18px; }
.badge-set { display: inline-block; background: #fbd8b0; color: #8a4b12; border-radius: 10px; font-size: 11px; padding: 0 8px; margin-bottom: 2px; }
.badge-hit { display: inline-block; background: var(--primary); color: #fff; border-radius: 3px; font-size: 10px; padding: 0 5px; margin-left: 4px; vertical-align: 1px; }
tr.row-hit td:first-child { box-shadow: inset 3px 0 0 var(--primary); }
.status { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 3px; white-space: nowrap; }
.status-公開 { background: #e3f3ea; color: #1d7a46; }
.status-非公開 { background: #eceff3; color: #555; }
.status-廃止 { background: #fbe7e7; color: #b42318; }
.pub-grid { display: flex; flex-wrap: wrap; width: 196px; gap: 2px 8px; font-size: 11px; font-weight: 700; color: #666; }
.pub-grid .on  { color: #d93636; font-weight: 400; }
.pub-grid .off { color: #b5bcc5; font-weight: 400; }
.link-btns { display: flex; flex-direction: column; gap: 4px; }
.link-btns .btn { font-size: 12px; padding: 1px 8px; white-space: nowrap; }
.actions { display: flex; align-items: center; gap: 10px; }
.btn-receive { font-size: 12px; padding: 3px 8px; white-space: nowrap; }
.icon-btn { background: none; border: none; color: #444; font-size: 18px; padding: 0; line-height: 1; }
.icon-btn:hover { color: var(--primary); }
.empty { text-align: center; color: var(--muted); padding: 40px 0 !important; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
@media (max-width: 900px) { .app-sidebar { display: none; } .app-logo { width: auto; margin-right: 16px; } }
  </style>
</head>
<body>

<header class="app-header">
  <a class="app-logo" href="#">ACE</a>
  <a class="app-shop" href="#">サンプル百貨店<i class="bi bi-chevron-right"></i></a>
  <div class="ms-auto d-flex align-items-center gap-4">
    <span class="mock-pill">MOCK</span>
    <div class="dropdown">
      <button class="app-user dropdown-toggle-none" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-person-circle"></i>管理者様<i class="bi bi-chevron-down"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="#">ログアウト</a></li>
      </ul>
    </div>
  </div>
</header>

<div class="app-body">
  <nav class="app-sidebar" aria-label="メニュー">
    <ul class="side-menu">
      <li><a href="#"><i class="bi bi-diagram-3-fill"></i>AALMホーム</a></li>
      <li><a href="#"><i class="bi bi-house-door-fill"></i>LMSホーム</a></li>
      <li>
        <a href="#menu-stock" data-bs-toggle="collapse" aria-expanded="false"><i class="bi bi-boxes"></i>在庫管理<i class="bi bi-chevron-down caret"></i></a>
        <ul class="collapse side-sub" id="menu-stock">
          <li><a href="#">入庫管理</a></li>
          <li><a href="#">在庫一覧</a></li>
        </ul>
      </li>
      <li>
        <a href="#menu-product" data-bs-toggle="collapse" aria-expanded="true"><i class="bi bi-box-seam-fill"></i>商品管理<i class="bi bi-chevron-down caret"></i></a>
        <ul class="collapse show side-sub" id="menu-product">
          <li><a href="#">商品一覧</a></li>
          <li><a href="#">商品規格一覧</a></li>
          <li><a href="#" class="current" aria-current="page">商品横断検索</a></li>
        </ul>
      </li>
    </ul>
  </nav>

  <main class="app-main">
    <div class="page-title">
      <h1>商品横断検索</h1>
      <span class="sub">管理</span>
    </div>

    <div class="page-content">
    <form id="searchForm" autocomplete="off">
      <div class="card search-card">
        <div class="card-header" data-bs-toggle="collapse" data-bs-target="#searchBody" role="button" aria-expanded="true">
          <i class="bi bi-search me-2"></i>基本検索
          <i class="bi bi-chevron-up ms-auto toggle-ico"></i>
        </div>
        <div id="searchBody" class="collapse show">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="s-name">商品名<span class="help" data-bs-toggle="tooltip" title="部分一致で検索します">?</span></label>
                <input type="text" class="form-control" id="s-name">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="s-code">商品コード<span class="help" data-bs-toggle="tooltip" title="カンマ区切りで複数指定できます（部分一致）">?</span></label>
                <input type="text" class="form-control" id="s-code" placeholder="10000001, 10000002">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="s-jan">JANコード<span class="help" data-bs-toggle="tooltip" title="カンマ区切りで複数指定できます（部分一致）">?</span></label>
                <input type="text" class="form-control" id="s-jan" placeholder="4944929005288, 100000000064">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="s-variant-code">商品規格コード<span class="help" data-bs-toggle="tooltip" title="カンマ区切りで複数指定できます（部分一致）">?</span></label>
                <input type="text" class="form-control" id="s-variant-code" placeholder="100000000012, 110100000001">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="s-history">掲載履歴コード<span class="help" data-bs-toggle="tooltip" title="カンマ区切りで複数指定できます（部分一致）">?</span></label>
                <input type="text" class="form-control" id="s-history" placeholder="PH0000001, PH0000002">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="s-business">業態区分</label>
                <select class="form-select" id="s-business" data-master="businessTypes"></select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="s-chopple">ちょっぷル種別</label>
                <select class="form-select" id="s-chopple" data-master="choppleTypes"></select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="s-spec">規格区分</label>
                <select class="form-select" id="s-spec" data-master="specTypes"></select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="s-saleform">販売形態</label>
                <select class="form-select" id="s-saleform" data-master="saleForms"></select>
              </div>
              <div class="col-md-6">
                <span class="form-label d-block">在庫</span>
                <div class="pt-1">
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="s-stock" id="stock-all" value="" checked>
                    <label class="form-check-label" for="stock-all">指定なし</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="s-stock" id="stock-yes" value="あり">
                    <label class="form-check-label" for="stock-yes">あり</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="s-stock" id="stock-no" value="なし">
                    <label class="form-check-label" for="stock-no">なし</label>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="s-pstatus">公開状態（商品）</label>
                <select class="form-select" id="s-pstatus" data-master="productStatuses"></select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="s-honten">本店公開状態</label>
                <select class="form-select" id="s-honten" data-master="hontenStatuses"></select>
              </div>
              <div class="col-md-6">
                <span class="form-label d-block">更新日時（商品）</span>
                <div class="range">
                  <input type="datetime-local" class="form-control" id="s-pupd-from" aria-label="更新日時（商品）開始">
                  <span>～</span>
                  <input type="datetime-local" class="form-control" id="s-pupd-to" aria-label="更新日時（商品）終了">
                </div>
              </div>
              <div class="col-md-6">
                <span class="form-label d-block">更新日時（商品規格）</span>
                <div class="range">
                  <input type="datetime-local" class="form-control" id="s-vupd-from" aria-label="更新日時（商品規格）開始">
                  <span>～</span>
                  <input type="datetime-local" class="form-control" id="s-vupd-to" aria-label="更新日時（商品規格）終了">
                </div>
              </div>
              <div class="col-md-6">
                <span class="form-label d-block">掲載日時</span>
                <div class="range">
                  <input type="datetime-local" class="form-control" id="s-post-from" aria-label="掲載日時 開始">
                  <span>～</span>
                  <input type="datetime-local" class="form-control" id="s-post-to" aria-label="掲載日時 終了">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="search-actions">
        <button type="button" class="btn btn-outline-secondary" id="btnClear">条件をクリア</button>
        <button type="submit" class="btn btn-primary btn-search"><i class="bi bi-search me-1"></i>検索</button>
      </div>
    </form>

    <section class="card result-card" id="results">
      <div class="card-body">
        <div class="result-head">
          <div>
            <div class="result-summary" id="resultSummary"></div>
            <div class="cond-list" id="condList"></div>
          </div>
          <div class="result-tools">
            <div class="form-check form-switch m-0">
              <input class="form-check-input" type="checkbox" id="matchOnly">
              <label class="form-check-label" for="matchOnly">条件に一致した属性・規格のみ表示</label>
            </div>
            <label class="d-flex align-items-center gap-2 m-0">
              表示件数
              <select class="form-select form-select-sm w-auto" id="perPage">
                <option>10</option><option selected>20</option><option>50</option>
              </select>
            </label>
          </div>
        </div>

        <div class="focus-bar" id="focusBar" hidden></div>

        <ul class="nav nav-tabs result-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active tab-btn-products" data-bs-toggle="tab" data-bs-target="#pane-products" data-tab="products" type="button" role="tab">
              <i class="bi bi-box"></i>商品<span class="tab-count" id="count-products">0</span>
            </button>
          </li>
          <li class="nav-item d-none" id="tab-item-histories" role="presentation">
            <button class="nav-link tab-btn-attributes" data-bs-toggle="tab" data-bs-target="#pane-histories" data-tab="histories" type="button" role="tab">
              <i class="bi bi-clock-history"></i>掲載履歴<span class="tab-count" id="count-histories">0</span>
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link tab-btn-variants" data-bs-toggle="tab" data-bs-target="#pane-variants" data-tab="variants" type="button" role="tab">
              <i class="bi bi-grid-3x3-gap"></i>商品規格<span class="tab-count" id="count-variants">0</span>
            </button>
          </li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane fade show active tab-products" id="pane-products" role="tabpanel" data-tab="products"></div>
          <div class="tab-pane fade tab-attributes" id="pane-histories" role="tabpanel" data-tab="histories"></div>
          <div class="tab-pane fade tab-variants" id="pane-variants" role="tabpanel" data-tab="variants"></div>
        </div>
      </div>
    </section>
    </div>
  </main>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toast" class="toast align-items-center text-bg-dark border-0" role="status" aria-live="polite">
    <div class="d-flex">
      <div class="toast-body" id="toastBody"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="閉じる"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
